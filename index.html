<title>Canaan GRiD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: operations console — fixed nav rail, sticky status bar, one working canvas per view.
   The nine aux codes own the colour system; the chrome stays cool and quiet around them. */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --panel-2:#F5F7F9; --sunk:#E6EAEE;
  --ink:#12202E; --ink-2:#384858; --muted:#677789; --line:#D7DEE5; --line-2:#E6EBF0;
  --accent:#1E4FCB; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --good:#13895B; --warn:#B7791F; --bad:#C62F44;
  --c-AV:#13895B; --c-SB:#B7791F; --c-MB:#C2541B; --c-MT:#6D4FC9; --c-ES:#C62F44;
  --c-TR:#1F7FC2; --c-CO:#0E8C8C; --c-FS:#B13C83; --c-OT:#5E7012; --c-OFF:#8C99A7;
  --shadow:0 1px 2px rgba(18,32,46,.06),0 8px 24px -12px rgba(18,32,46,.18);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
  --b-e:#1A7FAF; --b-d:#2D5BCB; --b-m:#7150C4; --b-n:#2F3B66; --b-leave:#A86A12; --b-unpl:#C62F44; --b-off:#8C99A7;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1117; --panel:#111A23; --panel-2:#16212C; --sunk:#0E151D;
  --ink:#E3E9EF; --ink-2:#BAC6D2; --muted:#8193A6; --line:#233140; --line-2:#1B2733;
  --accent:#7D9DFF; --accent-ink:#0B1117; --accent-soft:#1A2643;
  --good:#3CCB8D; --warn:#E9B04B; --bad:#F2677A;
  --c-AV:#3CCB8D; --c-SB:#E9B04B; --c-MB:#F08A50; --c-MT:#A58BF2; --c-ES:#F2677A;
  --c-TR:#5CB4F0; --c-CO:#3FC9C4; --c-FS:#E57AB9; --c-OT:#B5CB4A; --c-OFF:#5D6C7C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --b-e:#56B6E6; --b-d:#7D9DFF; --b-m:#AE92F5; --b-n:#9AA6D8; --b-leave:#E9B04B; --b-unpl:#F2677A; --b-off:#6B7B8C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1117; --panel:#111A23; --panel-2:#16212C; --sunk:#0E151D;
  --ink:#E3E9EF; --ink-2:#BAC6D2; --muted:#8193A6; --line:#233140; --line-2:#1B2733;
  --accent:#7D9DFF; --accent-ink:#0B1117; --accent-soft:#1A2643;
  --good:#3CCB8D; --warn:#E9B04B; --bad:#F2677A;
  --c-AV:#3CCB8D; --c-SB:#E9B04B; --c-MB:#F08A50; --c-MT:#A58BF2; --c-ES:#F2677A;
  --c-TR:#5CB4F0; --c-CO:#3FC9C4; --c-FS:#E57AB9; --c-OT:#B5CB4A; --c-OFF:#5D6C7C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --b-e:#56B6E6; --b-d:#7D9DFF; --b-m:#AE92F5; --b-n:#9AA6D8; --b-leave:#E9B04B; --b-unpl:#F2677A; --b-off:#6B7B8C;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}

/* ---------- splash / login ---------- */
.splash{min-height:100%;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.splash-box{display:grid;gap:14px;justify-items:center;text-align:center;max-width:420px}
.mark{display:grid;grid-template-columns:repeat(3,9px);gap:3px}
.mark i{width:9px;height:9px;border-radius:2px;display:block}
.mark.lg{grid-template-columns:repeat(3,16px);gap:5px}.mark.lg i{width:16px;height:16px;border-radius:4px}
.spin-row{display:flex;gap:4px}.spin-row i{width:8px;height:8px;border-radius:2px;background:var(--accent);animation:blip 1s infinite ease-in-out}
.spin-row i:nth-child(2){animation-delay:.15s}.spin-row i:nth-child(3){animation-delay:.3s}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
.brand{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;font-size:18px;display:flex;align-items:center;gap:10px}
.brand b{font-weight:700;color:var(--accent)}

.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{background:var(--panel);border-right:1px solid var(--line);padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;gap:36px}
.login-art h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.2vw,40px);line-height:1.1;letter-spacing:-.02em;max-width:16ch}
.login-art p{color:var(--ink-2);max-width:46ch;margin:0}
.login-logo{flex:1;display:grid;place-items:center;padding-block:24px}
.login-logo img{width:min(300px,70%);height:auto}
.code-legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:520px}
.code-legend div{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--c) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);font-size:12.5px;font-weight:500;min-width:0}
.code-legend kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.code-legend i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.login-form-wrap{display:grid;place-items:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-form{width:min(400px,100%);display:grid;gap:18px}
.login-form h2{font-size:22px}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inp,.sel{width:100%;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:0 12px;min-width:0}
.sel{padding-right:8px}
.inp:focus,.sel:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.sm,.sel.sm{height:32px;font-size:13px;padding:0 8px}
textarea.inp{height:auto;padding:10px 12px;min-height:64px;resize:vertical}
.pw-wrap{position:relative}.pw-wrap .inp{padding-right:64px}
.pw-wrap button{position:absolute;right:6px;top:6px;height:28px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:0 8px;border-radius:5px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.demo-list{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:16px}
.demo-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:9px 11px;text-align:left}
.demo-btn:hover{border-color:var(--accent)}
.demo-btn .rl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);width:84px;flex:none}
.demo-btn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-btn .us{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.hint code,.mono-chip{text-transform:none;letter-spacing:0;font-family:var(--f-mono);background:var(--sunk);padding:1px 6px;border-radius:4px;color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.lg{height:46px;padding:0 20px;font-size:14.5px}
.btn svg{width:15px;height:15px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:20px 14px 18px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;height:100dvh}
.side .brand{padding:2px 8px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--ink-2);font-weight:500;text-align:left}
.nav button svg{width:17px;height:17px;flex:none;opacity:.8}
.nav button:hover{background:var(--panel-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button[aria-current="page"] svg{opacity:1}
.nav .sep{height:1px;background:var(--line-2);margin:8px 6px}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--muted);padding:0 8px}
.mode{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.dot.local{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.dot.err{background:var(--bad)}

.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-size:18px;font-weight:600}
.top .sub{font-size:12.5px;color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.me-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--ink-2);flex:none;letter-spacing:.02em}
.me-chip .r{color:var(--muted);font-size:11.5px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:210px;padding:6px;display:grid;z-index:40}
.menu button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:6px}
.menu button:hover{background:var(--panel-2)}
.rel{position:relative}
.view{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start;min-width:0}
.bottom-nav{display:none}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-b{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.spacer{margin-left:auto}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 82%,var(--ink));white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--panel)}
.pill.P{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.pill.L{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.pill.AB{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--panel))}
.pill.SC{color:var(--muted);border-style:dashed}
.pill.AL,.pill.MC,.pill.EL,.pill.OD,.pill.HD,.pill.WFH{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.lock{font-size:11px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}

/* ---------- console ---------- */
.console{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.state-card{--c:var(--c-OFF);border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:var(--shadow)}
.sc-top{background:color-mix(in srgb,var(--c) 15%,var(--panel));padding:18px 22px 22px;display:grid;gap:14px;position:relative}
.sc-top::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--c)}
.sc-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.sc-code{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.02em;line-height:1.05;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.sc-timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(34px,5vw,56px);font-weight:500;letter-spacing:-.02em;line-height:1}
.sc-timer.over{color:var(--bad)}
.sc-sub{font-size:13px;color:var(--ink-2)}
.sc-bot{padding:16px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.limit-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;max-width:360px}
.limit-bar i{display:block;height:100%;background:var(--c)}
.limit-bar.over i{background:var(--bad)}

.auxpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.auxbtn{--c:var(--c-OFF);position:relative;display:grid;gap:10px;align-content:space-between;min-height:88px;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);text-align:left;transition:border-color .15s,background .15s,transform .08s}
.auxbtn:hover:not(:disabled){border-color:var(--c)}
.auxbtn:active:not(:disabled){transform:translateY(1px)}
.auxbtn i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.auxbtn b{font-weight:600;font-size:14px}
.auxbtn small{color:var(--muted);font-size:11.5px}
.auxbtn kbd{position:absolute;right:11px;top:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.auxbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.auxbtn:disabled{opacity:.42;cursor:not-allowed}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-2);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--panel);padding:13px 14px;display:grid;gap:4px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}

/* timeline */
.tl{display:grid;gap:6px}
.tl-track{position:relative;height:30px;border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--hrs) - 1px),var(--line-2) calc(100%/var(--hrs) - 1px) calc(100%/var(--hrs)));background-color:var(--sunk);overflow:hidden}
.tl-shift{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tl-seg{position:absolute;top:5px;bottom:5px;border-radius:3px;background:var(--c);min-width:2px}
.tl-seg.base{top:12px;bottom:12px;opacity:.55}
.tl-now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.tl-axis{position:relative;height:14px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}

.log-list{display:grid}
.log-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.log-item:last-child{border-bottom:0}
.log-item .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

/* ---------- floor ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:grid;gap:3px;min-width:0}
.kpi b{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{font-style:normal;font-size:11.5px;color:var(--muted)}
.kpi.alert b{color:var(--bad)}
.dist{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.dist i{display:block;background:var(--c);height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px}
.legend button i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend button b{font-family:var(--f-mono);font-weight:500}
.legend button[aria-pressed="true"]{border-color:var(--ink);background:var(--panel-2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .sel,.filters .inp{width:auto;height:34px;font-size:13px}
.filters .inp{width:200px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.teams{display:grid;gap:0}
.team-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:start}
.team-row:last-child{border-bottom:0}
.team-name{display:grid;gap:2px;min-width:0}
.team-name b{font-weight:600}
.team-name span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seats{display:flex;flex-wrap:wrap;gap:5px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

/* ---------- reports ---------- */

/* ---------- drawer / modal / toast ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#05090d 42%,transparent);z-index:70;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:71;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:flex-start}
.drawer-b{padding:18px 20px;overflow-y:auto;display:grid;gap:18px;align-content:start}
.x{margin-left:auto;border:0;background:transparent;width:32px;height:32px;border-radius:6px;font-size:18px;color:var(--muted)}

.edit-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.section-t{display:flex;align-items:center;gap:10px}
.modal{position:fixed;z-index:72;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);animation:fade .15s}
.modal.wide{width:min(860px,calc(100% - 32px))}
.ot-cell{display:flex;gap:6px;align-items:center}.ot-cell .sel{min-width:0}.pill.ot{background:color-mix(in srgb,var(--c-OT) 16%,transparent);color:var(--ink)}
.lists-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.list-box{display:grid;gap:10px;align-content:start;border:1px solid var(--line);border-radius:12px;padding:12px}.list-items{display:grid;gap:2px;max-height:300px;overflow:auto}.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid var(--line-2)}.list-item:last-child{border-bottom:0}
.ot-form{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:12px}.lv-editing{outline:2px solid var(--accent, #2b5cd9);outline-offset:-2px}
@media (max-width:760px){.lists-grid{grid-template-columns:1fr}.ot-form{grid-template-columns:1fr 1fr}.ot-form .field{grid-column:auto!important}}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn.undo{padding:2px 8px;font-size:11.5px;min-height:0;height:auto;color:var(--muted)}.btn.undo:hover{color:var(--ink)}
.ent-fields th{white-space:normal}.ent-fields td.rule-t{font-family:var(--f-body);white-space:nowrap}.ent-fields td:last-child{width:190px}.modal .form-grid .sel{min-width:0;text-overflow:ellipsis}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px 20px;display:grid;gap:14px}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.checks{display:grid;gap:4px;font-size:12.5px}
.checks div{display:flex;gap:8px;align-items:center;color:var(--muted)}
.checks div::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none}

.temp-pw{font-family:var(--f-mono);font-size:22px;letter-spacing:.06em;padding:14px;border-radius:var(--r-sm);background:var(--sunk);text-align:center;user-select:all}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;justify-items:end}
.toast{background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:var(--r-sm);font-size:13px;box-shadow:var(--shadow);max-width:360px;animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}
.notice.warn{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.notice.row{align-items:center;flex-wrap:wrap}
.seat.missed::after{content:"";position:absolute;inset:-4px;border-radius:9px;border:2px dashed var(--bad)}
.seat.tl.missed::after{border-radius:50%}
.miss{border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel));color:var(--bad);font-size:11.5px;font-weight:600;border-radius:5px;height:22px;padding:0 8px;font-family:var(--f-body)}

.empty{padding:36px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.notice{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}

/* ---------- projects ---------- */
.proj-sel{width:auto;min-width:150px;font-weight:600}
.proj-tag{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;white-space:nowrap}
.proj-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:14px 16px}
.proj-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);min-width:0}
.proj-item>div:first-child{flex:1;min-width:0}

/* ---------- schedule ---------- */
.b-e{--b:var(--b-e)}.b-d{--b:var(--b-d)}.b-m{--b:var(--b-m)}.b-n{--b:var(--b-n)}.b-leave{--b:var(--b-leave)}.b-unpl{--b:var(--b-unpl)}.b-off{--b:var(--b-off)}
.paintbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2);background:var(--panel-2)}
.paintbar.on{background:var(--accent-soft)}
.sgrid-wrap{overflow:auto;max-height:min(70vh,760px);border-top:1px solid var(--line-2)}
.sgrid{border-collapse:separate;border-spacing:0;font-size:12px}
.sgrid th,.sgrid td{padding:0;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:center;height:36px;min-width:40px}
.sgrid thead th{position:sticky;top:0;z-index:3;background:var(--panel-2);font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.2;padding:4px 0}

.sgrid tfoot .stk{z-index:4;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sgrid td.we{background:var(--panel-2)}
.sgrid th.today{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.sgrid th.today .mono{color:var(--accent)}
.sgrid .who{min-width:0}
.sgrid .who button{border:0;background:transparent;padding:0;text-align:left;font-weight:600;color:var(--ink);font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrid .who button:hover{color:var(--accent)}
.sgrid .who button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cday .sh .short{display:none}
.sgrid .who button small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.scell{display:grid;place-items:center;height:100%;font-family:var(--f-mono);font-size:11.5px;font-weight:600;position:relative;background:color-mix(in srgb,var(--b) 15%,transparent);color:color-mix(in srgb,var(--b) 85%,var(--ink));cursor:pointer;user-select:none}
.scell.b-off{background:transparent;color:var(--muted);font-weight:500;font-size:10.5px}
.scell.dft{background:transparent;color:var(--muted);font-weight:400;font-style:italic;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--b) 18%,transparent)}
.scell.b-off.dft{box-shadow:none;opacity:.7}
.scell .ad{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%}
.painting .scell.ed{cursor:crosshair}
.painting .scell.ed:hover{outline:2px solid var(--accent);outline-offset:-2px}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line-2)}
.legend-row .lg{display:inline-flex;align-items:center;gap:6px}
.legend-row .lg i{width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--b) 22%,transparent);border:1px solid color-mix(in srgb,var(--b) 50%,transparent);display:inline-block}
.legend-row .lg i.dft-i{background:transparent;border:1px dashed var(--muted)}
.legend-row .lg i.dot-i{width:8px;height:8px;border-radius:50%;border:0}
.up-list{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:12px 14px}
.up{display:grid;justify-items:center;gap:2px;padding:8px 2px;border-radius:8px;background:color-mix(in srgb,var(--b) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--b) 25%,transparent);min-width:0}
.up.b-off{background:var(--panel-2);border-color:var(--line-2)}
.up .dw{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.up .dd{font-family:var(--f-mono);font-size:15px;font-weight:600}
.up .sh{font-family:var(--f-mono);font-size:11px;color:color-mix(in srgb,var(--b) 85%,var(--ink));font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding-bottom:2px}
.cday{min-height:96px;border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;background:var(--panel);min-width:0}

.cday .sh.b-off{background:transparent;color:var(--muted);padding-left:0}

.scell.lvon{box-shadow:inset 0 0 0 2px var(--b);font-weight:700}

.ent-h small{display:block;font-size:9.5px;letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--muted)}

.over-box{grid-column:1/-1;border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--panel));border-radius:var(--r-sm);padding:12px 14px;font-size:13px}

/* ---------- timeline ---------- */
function timelineHTML(s, rec, dateKey) {
  const now = Date.now(); const isToday = dateKey === today();
  const sh = shiftFor(s, dateKey); let sStart, sEnd;
  if (sh.kind === 'work') [sStart, sEnd] = shiftTimes(sh, dateKey); else { sStart = (rec && rec.login) || G.atTime(dateKey, '09:00'); sEnd = sStart + 9 * 3600000; }
  let from = sStart - 3600000, to = sEnd + 3600000;
  if (rec && rec.login) from = Math.min(from, rec.login - 1800000);
  if (rec && rec.logout) to = Math.max(to, rec.logout + 1800000);
  if (isToday) to = Math.max(to, Math.min(now + 1800000, G.atTime(dateKey, '23:59')));
  from = Math.floor(from / 3600000) * 3600000; to = Math.ceil(to / 3600000) * 3600000;
  const span = to - from; const pct = t => ((t - from) / span * 100).toFixed(3) + '%';
  const w = (a, b) => ((Math.max(0, b - a)) / span * 100).toFixed(3) + '%';
  const hrs = Math.round(span / 3600000);
  let segs = sh.kind !== 'work' ? '' : `<div class="tl-shift" style="left:${pct(sStart)};width:${w(sStart, sEnd)}" title="Scheduled shift"></div>`;
  if (rec && rec.login) {
    const end = rec.logout || (isToday ? now : rec.login);
    segs += `<div class="tl-seg base" style="--c:var(--c-AV);left:${pct(rec.login)};width:${w(rec.login, end)}"></div>`;
    for (const a of rec.aux || []) { const e = a.e ?? (rec.logout || (isToday ? now : a.s)); segs += `<div class="tl-seg" style="--c:var(--c-${a.c});left:${pct(a.s)};width:${w(a.s, e)}" title="${esc((CODE[a.c] || {}).n)} ${hm(a.s)}–${a.e ? hm(a.e) : 'now'}"></div>`; }
  }
  if (isToday && now > from && now < to) segs += `<div class="tl-now" style="left:${pct(now)}" title="Now"></div>`;
  let axis = ''; const step = hrs > 14 ? 3 : 2;
  for (let i = 0; i <= hrs; i += step) { const t = from + i * 3600000; axis += `<span style="left:${(i / hrs * 100).toFixed(2)}%;${i === 0 ? 'transform:none' : i + step > hrs ? 'transform:translateX(-100%)' : ''}">${pad(new Date(t).getHours())}:00</span>`; }
  return `<div class="tl"><div class="tl-track" style="--hrs:${hrs}">${segs}</div><div class="tl-axis">${axis}</div></div>`;
}

// Project › department › team grouping used by the director views and grouped pages
const grpOf = s => [s.proj || 'No project', s.dept || 'No department'];

  const sort = m => [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));

function viewMySchedule(person) {

  return `<section class="panel"><div class="panel-h">

    }

}

const bandIndex = y => y < 2 ? 0 : y < 5 ? 1 : 2;

/* ----- admin: pay data (admin-only store) and PHIL ----- */
const payOf = id => ((S.pay && S.pay.staff) || {})[id] || {};
function ensurePay() { if (!isSysAdmin() || S.paySub || !S.store.onPay) return; S.paySub = S.store.onPay(d => { S.pay = d || { staff: {} }; render(); schedulePhilSync(); }); }
function schedulePhilSync() { clearTimeout(S.philTimer); S.philTimer = setTimeout(philSync, 1500); }
async function loadPhDays(year) {
  const dates = leaveCfg().ph.filter(p => p.date.slice(0, 4) === year && p.date <= today()).map(p => p.date); const out = {};
  await Promise.all(dates.map(async k => { if (S.phDays[k] && k < today()) { out[k] = S.phDays[k]; return; } try { const l = await S.store.getDays(k, k); S.phDays[k] = l[0] || { date: k, recs: {} }; out[k] = S.phDays[k]; } catch (e) { console.warn(e); } }));
  return out;
}
// Staff above the salary limit who worked a listed public holiday get one PHIL day added to their annual leave
async function philSync(manual) {
  if (!isSysAdmin() || !S.pay || S.pay.unavailable || S.philBusy) return; S.philBusy = true;
  try { const cfg = leaveCfg(); const patch = {}; let added = 0;
    for (const year of [String(+curYear() - 1), curYear()]) { const days = await loadPhDays(year);
      for (const p of cfg.ph.filter(x => x.date.slice(0, 4) === year)) { const day = days[p.date]; if (!day) continue;
        for (const [id, rec] of Object.entries(day.recs || {})) { const s = S.byId[id]; if (!s || !rec.login) continue; const sal = +payOf(id).salary || 0; if (sal <= cfg.salaryLimit) continue;
          const cur = (patch[id] && patch[id].phil[year]) || philEarned(s, year).slice(); if (cur.some(x => x.date === p.date)) continue;
          cur.push({ date: p.date, name: p.name }); ((patch[id] = patch[id] || { phil: {} }).phil[year] = cur); added++; } } }
    if (added) { await S.store.patchRoster({ staff: patch }); audit('PHIL days added', added + ' day' + (added === 1 ? '' : 's'), Object.entries(patch).map(([id, p]) => `${(S.byId[id] || {}).name}: ${Object.values(p.phil).flat().map(x => x.date).join(', ')}`).join(' · ').slice(0, 400)); }
    if (manual) toast(added ? `${added} PHIL day${added === 1 ? '' : 's'} added to annual leave` : 'PHIL is up to date');
    render();
  } catch (e) { console.warn(e); if (manual) fail(e); } finally { S.philBusy = false; }
}
function phWorkRows(year) {
  const cfg = leaveCfg(); const out = [];
  for (const p of cfg.ph.filter(x => x.date.slice(0, 4) === year && x.date <= today())) { const day = S.phDays[p.date]; if (!day) continue;
    for (const [id, rec] of Object.entries(day.recs || {})) { const s = S.byId[id]; if (!s || !rec.login) continue; const m = metrics(rec, s, p.date, Date.now()); const pay = payOf(id); const sal = +pay.salary || 0;
      const otH = rec.ot && +rec.ot.h || 0; out.push({ p, s, hours: m.logged / 3600000, sal, pay, otH, otAmt: otH && sal ? otAmount(id, 'PH', otH) : 0, phil: sal > cfg.salaryLimit, credited: philEarned(s, year).some(x => x.date === p.date) }); } }
  return out.sort((a, b) => a.p.date.localeCompare(b.p.date) || a.s.name.localeCompare(b.s.name));
}

      if (!mail && S.store.sendMail) { setErr('This account has no email address (the username is not an email). Ask an admin to reset your password.'); break; }
      m.busy = true; m.err = ''; renderLayer();
      const pw = tempPassword(); const salt = newSalt(); const it = 120000; const now = Date.now();
      try {
        await S.store.patchStaff(s.id, { reset: { salt, it, hash: await pbkdf2(pw, salt, it), exp: now + 30 * 60000, at: now } });
        const link = location.origin + location.pathname;
        if (S.store.sendMail) {
          try { await S.store.sendMail(mail, 'Canaan GRiD temporary password', `<p>Hello ${esc(firstName(s.name))},</p><p>A password reset was requested for your Canaan GRiD account <b>${esc(s.user)}</b>.</p><p>Temporary password: <b style="font-family:monospace;font-size:16px">${esc(pw)}</b></p><p>It works for 30 minutes. Sign in at <a href="${esc(link)}">${esc(link)}</a> and choose a new password. Your current password keeps working until you use this one.</p><p>If you did not ask for this, you can ignore this email.</p><p>— Canaan GRiD</p>`);
            S.store.addAudit({ at: now, by: s.id, byName: s.name, act: 'Password reset emailed', target: s.name + ' (' + SID(s) + ')', detail: 'Temporary password sent to ' + mail });
            Object.assign(m, { busy: false, sent: mail.replace(/^(.)(.*)(@.*)$/, (a, b, c, d) => b + '•'.repeat(Math.min(6, c.length)) + d) }); renderLayer(); }
          catch (x) { if (S.store.isOwner && await S.store.isOwner()) { Object.assign(m, { busy: false, temp: pw, name: s.name, user: s.user }); renderLayer(); } else setErr('The email could not be sent (' + x.message + ') Ask an admin to reset your password.'); }
        } else { Object.assign(m, { busy: false, temp: pw, name: s.name, user: s.user, demo: true }); renderLayer(); }
      } catch (x) { setErr(x.message || 'Something went wrong. Try again.'); }
      break; }
    case 'fp-done': { const u = S.modal && (S.modal.user || S.modal.prefill); S.modal = null; renderLayer(); const el = $('#lg-user'); if (el && u) { el.value = u; $('#lg-pw').focus(); } break; }
    case 'do-reset': { const s = S.byId[S.modal.id]; const pw = tempPassword(); const salt = newSalt(); const it = 120000;
      try { await S.store.patchStaff(s.id, { salt, it, hash: await pbkdf2(pw, salt, it), must: true, fails: 0, lock: 0 }); S.modal.temp = pw; audit('Reset password', s.name + ' (' + SID(s) + ')', 'Temporary password issued'); renderLayer(); } catch (x) { fail(x); } break; }
    case 'copy-temp': { const v = S.modal.temp; try { await navigator.clipboard.writeText(v); toast('Copied'); } catch (x) { const r = document.createRange(); r.selectNodeContents($('#temp-pw')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Press Ctrl+C to copy'); } break; }
    case 'unlock': { const s = S.byId[id]; await S.store.patchStaff(id, { fails: 0, lock: 0 }).catch(fail); audit('Unlocked account', s.name + ' (' + SIDof(id) + ')', ''); toast(s.name + ' unlocked'); break; }
    case 'shr-send': t.disabled = true; await sendShiftRequest(); break;
    case 'shr-discard': for (const ym of Object.keys(S.sc.draft || {})) delete S.sc.overlay[ym]; S.sc.draft = {}; render(); break;
    case 'shr-approve': case 'shr-decline': case 'shr-delete': t.disabled = true; await decideShr(id, a.slice(4)); break;
    case 'sc-month': S.sc.month = G.addMonths(S.sc.month, +t.dataset.d); render(); break;
    case 'sc-mine': S.sc.mine = true; S.sc.person = S.me.id; render(); break;
    case 'sc-grid': S.sc.mine = false; render(); break;
    case 'sc-person': S.sc.mine = true; S.sc.person = id; render(); scrollTo(0, 0); break;
    case 'sc-export': exportSchedule(); break;
    case 'sc-export-person': exportPersonSchedule(id); break;
    case 'sc-create': openModal({ type: 'builder', month: G.addMonths(ymOf(today()), 1), dept: S.sc.proj, team: '', shift: 'usual', pattern: 'wk', offDays: [0, 6], mode: 'fill', keep: true }); break;
    case 'sc-upload': openModal({ type: 'upload', month: S.sc.month }); break;
    case 'b-create': { readBuilder(); const m = S.modal; const plan = builderPlan(m); if (!plan.cells) return; t.disabled = true; t.textContent = 'Saving…';
      try { await S.store.patchSched(m.month, plan.rows); audit('Created schedule', Object.keys(plan.rows).length + ' staff', `${monthLabel(m.month)}: ${plan.cells} days · ${m.pattern === 'wk' ? 'Mon–Fri' : m.pattern === 'rot' ? '5 on 2 off' : 'custom rest days'} · ${m.shift === 'usual' ? 'usual shifts' : m.shift}${m.mode === 'replace' ? ' · replaced existing' : ''}`); S.modal = null; renderLayer(); S.sc.month = m.month; S.sc.mine = false; toast(`Schedule saved: ${plan.cells.toLocaleString()} days for ${Object.keys(plan.rows).length} staff`); render(); }
      catch (x) { fail(x); t.disabled = false; t.textContent = 'Create schedule'; } break; }
    case 'u-template': { const ym = $('#u-month') ? $('#u-month').value : S.modal.month; const people = scopeStaff().filter(canEditSched); saveWorkbook(scheduleBook(ym, people), `CanaanGRiD_Schedule_Template_${(S.project || 'All').replace(/\W+/g, '')}_${ym}.xlsx`); break; }
    case 'u-again': S.modal.res = null; S.modal.err = ''; renderLayer(); break;
    case 'u-apply': { const r = S.modal.res; t.disabled = true; t.textContent = 'Saving…'; try { const n = await applyUpload(r); S.modal = null; renderLayer(); const first = [...r.months].sort()[0]; if (first) S.sc.month = first; S.sc.mine = false; toast(`Schedule uploaded: ${n.toLocaleString()} days for ${r.staff.size} staff`); render(); } catch (x) { fail(x); t.disabled = false; } break; }
    case 'proj-rename': openModal({ type: 'proj', name: t.dataset.p }); break;
    case 'proj-del': { const nm = t.dataset.p; const n = S.staff.filter(x => x.proj === nm).length; if (n) { toast(`${nm} is still assigned to ${n} staff (active or inactive). Move them to another project first.`, true); break; }
      try { await S.store.patchRoster({ projects: projectList().filter(p => p.name !== nm) }); audit('Deleted project', nm, ''); toast(nm + ' deleted'); } catch (x) { fail(x); } break; }
    case 'list-edit': openModal({ type: 'listedit', k: t.dataset.k, v: t.dataset.v }); break;
    case 'list-del': { const k = t.dataset.k, v = t.dataset.v; const n = listUse(k, v); if (n) { toast(`${v} is used by ${n} staff. Change them first, or edit the name instead.`, true); break; }
      await saveList(k, (k === 'pos' ? posList() : deptList()).filter(x => x !== v), 'Deleted ' + LIST_NAMES[k][1], v + ' deleted'); break; }
    case 'proj-toggle': { const nm = t.dataset.p; try { await S.store.patchRoster({ projects: projectList().map(p => p.name === nm ? Object.assign({}, p, { active: p.active === false }) : p) }); audit('Changed project visibility', nm, ''); } catch (x) { fail(x); } break; }
    case 'export-att': exportAttendance(); break;
    case 'export-report': exportReport(); break;
    case 'export-floor': exportFloor(); break;
    case 'export-mine': exportMine(); break;
    case 'export-staff': exportStaff(); break;

  }
});
function syncEdit() {

async function saveAdminEdit() {
  syncEdit(); const D = S.drawer; const d = D.edit; const k = D.date; const err = t => $('#ed-err').textContent = t;
  const login = fromHM(k, d.login), logout = fromHM(k, d.logout);
  if (!login && (logout || d.aux.length)) return err('Enter a log-in time, or remove the log-out time and aux entries.');
  if (login && logout && logout <= login) return err('Log out must be after log in.');
  const aux = [];
  for (const a of d.aux) {
    const s = fromHM(k, a.s), e = fromHM(k, a.e);
    if (!s) return err('Every aux entry needs a start time.');
    if (e && e <= s) return err(CODE[a.c].n + ' at ' + a.s + ' ends before it starts.');
    if (s < login || (logout && (e || s) > logout)) return err(CODE[a.c].n + ' at ' + a.s + ' falls outside the logged-in time.');
    aux.push({ c: a.c, s, e: e || (logout ? logout : null) });
  }
  aux.sort((x, y) => x.s - y.s);
  for (let i = 1; i < aux.length; i++) if (aux[i].s < (aux[i - 1].e ?? Infinity)) return err('Aux entries at ' + hm(aux[i - 1].s) + ' and ' + hm(aux[i].s) + ' overlap.');
  if (k !== today() && aux.some(a => a.e == null)) return err('Past entries need an end time.');
  const day = dayFor(k); const old = normRec(recOf(D.id, day));
  const rec = normRec({ login, logout, aux, st: d.st || null, rm: d.rm.trim() || null, ed: S.me.id, ea: Date.now(), ad: true, adBy: S.me.id });
  try {
    await S.store.patchRec(k, D.id, rec);
    audit('Admin correction', S.byId[D.id].name + ' (' + D.id + ')', `${k}: log in ${hm(old.login)}→${hm(login)}, log out ${hm(old.logout)}→${hm(logout)}, ${old.aux.length}→${aux.length} aux entries`);
    D.edit = null; renderLayer(); toast('Record corrected and locked');
  } catch (x) { fail(x); }
}

  if (t.id === 'sc-custom') { const p = parseShift(t.value); if (p.val) { S.sc.brush = p.val; render(); } else if (t.value.trim()) toast('Type a time like 07:30 or a range like 21:00-06:00.', true); return; }
  if (t.dataset.f) { const sc = t.closest('[data-scope]').dataset.scope; const obj = S[sc]; obj[t.dataset.f] = t.value; if (t.dataset.f === 'dept' || t.dataset.f === 'proj') obj.team = ''; t.blur(); render(); }

/* ---------- clock / timers ---------- */
function tick() {
  const now = Date.now(); const cl = $('#clock'); if (cl) cl.textContent = new Date(now).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  $$('[data-since]').forEach(el => {
    const since = +el.dataset.since; if (!since) return; const el2 = now - since; const lim = +el.dataset.limit || 0;
    if (el.dataset.fmt === 'bar') { const i = el.firstElementChild; if (i) i.style.width = Math.min(100, el2 / 60000 / lim * 100).toFixed(1) + '%'; el.classList.toggle('over', lim && el2 > lim * 60000); return; }
    el.textContent = clock(el2); if (lim) el.classList.toggle('over', el2 > lim * 60000);
  });
}

/* ---------- boot ---------- */
async function boot() {
  renderSplash('Starting Canaan GRiD…');
  try {
    const od = CFG.onedrive || {};
    if (od.clientId) S.store = new OneDriveStore(od);
    else {
      let db = null;
      if (window.claude && typeof window.claude.use === 'function') {
        setSplash('Connecting to the live database…');
        const [d, dl, as] = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('downloads').catch(() => null), window.claude.use('assets').catch(() => null)]);
        db = d; CAPS.downloads = dl; CAPS.assets = as;
      }
      S.store = db ? new DbStore(db) : new LocalStore();
    }
    await S.store.init(setSplash);
    if (S.store.needsSetup) return renderOneDriveSetup();
    setSplash('Loading staff list…');
    S.store.onRoster(onRoster);
    subscribeToday();
  } catch (e) { renderFatal(e); }
}
